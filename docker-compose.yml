services:
  sentinel-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sentinel
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    networks:
      - nginx-proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentinel-app:
    build: .
    restart: unless-stopped
    depends_on:
      sentinel-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://sentinel:${DB_PASSWORD}@sentinel-db:5432/sentinel"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXTAUTH_URL: "https://sentinel.noxia-groupe.fr"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER}
      AUTH_TRUST_HOST: "true"
      # Heure de Paris (été/hiver automatique) pour les journaux et l'affichage
      # côté serveur. Les dates restent stockées en UTC en base.
      TZ: ${TZ:-Europe/Paris}
      # Fuseau des enregistreurs : heure écrite par « Mettre à l'heure ».
      DAHUA_TIME_ZONE: ${DAHUA_TIME_ZONE:-Europe/Paris}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      # Adresse déclarée aux NVR comme centre d'alarme (défaut : NEXTAUTH_URL).
      ALARM_CENTER_URL: ${ALARM_CENTER_URL:-}
      # Tunnel P2P : l'utilitaire `dh-fwd` embarqué dans l'image est utilisé par
      # défaut. On ne surcharge DAHUA_P2P_HELPER que pour pointer un autre
      # utilitaire — une valeur VIDE désactiverait le P2P, donc on met le défaut
      # embarqué comme repli d'interpolation plutôt qu'une chaîne vide.
      DAHUA_P2P_HELPER: ${DAHUA_P2P_HELPER:-/usr/local/bin/dh-fwd {serial} -p {port}:{devicePort}}
      # Profil applicatif essayé en premier : `smartpss` (cloud easy4ip) ou
      # `dmss` (cloud Dolynk). Si le cloud répond 404 (mauvais cloud), SENTINEL
      # bascule seul sur l'autre profil et retient celui qui marche par NVR.
      DAHUA_P2P_PROFILE: ${DAHUA_P2P_PROFILE:-smartpss}
      # Mode relais P2P (1 = actif) pour les équipements derrière un NAT qui
      # bloque la connexion directe. Laisser vide pour la connexion directe.
      DAHUA_P2P_RELAY: ${DAHUA_P2P_RELAY:-}
    networks:
      - nginx-proxy

volumes:
  sentinel_pgdata:

networks:
  nginx-proxy:
    external: true
