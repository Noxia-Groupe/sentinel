services:
  sentinel-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sentinel
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    # Réseau interne uniquement : la base n'est joignable que par l'application,
    # jamais par les autres conteneurs du réseau du reverse proxy.
    networks:
      - sentinel-internal
    # Durcissement : pas d'escalade de privilèges, capacités réduites à ce que
    # l'image officielle utilise (changement d'utilisateur, propriété des fichiers).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 256
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentinel-app:
    build: .
    restart: unless-stopped
    depends_on:
      sentinel-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://sentinel:${DB_PASSWORD}@sentinel-db:5432/sentinel"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXTAUTH_URL: "https://sentinel.noxia-groupe.fr"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER}
      AUTH_TRUST_HOST: "true"
      # Heure de Paris (été/hiver automatique) pour les journaux et l'affichage
      # côté serveur. Les dates restent stockées en UTC en base.
      TZ: ${TZ:-Europe/Paris}
      # Fuseau des enregistreurs : heure écrite par « Mettre à l'heure ».
      DAHUA_TIME_ZONE: ${DAHUA_TIME_ZONE:-Europe/Paris}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      # Adresse déclarée aux NVR comme centre d'alarme (défaut : NEXTAUTH_URL).
      ALARM_CENTER_URL: ${ALARM_CENTER_URL:-}
      # Tunnel P2P : l'utilitaire `dh-fwd` embarqué dans l'image est utilisé par
      # défaut. On ne surcharge DAHUA_P2P_HELPER que pour pointer un autre
      # utilitaire — une valeur VIDE désactiverait le P2P, donc on met le défaut
      # embarqué comme repli d'interpolation plutôt qu'une chaîne vide.
      DAHUA_P2P_HELPER: ${DAHUA_P2P_HELPER:-/usr/local/bin/dh-fwd {serial} -p {port}:{devicePort}}
      # Profil applicatif essayé en premier : `smartpss` (cloud easy4ip) ou
      # `dmss` (cloud Dolynk). Si le cloud répond 404 (mauvais cloud), SENTINEL
      # bascule seul sur l'autre profil et retient celui qui marche par NVR.
      DAHUA_P2P_PROFILE: ${DAHUA_P2P_PROFILE:-smartpss}
      # Mode relais P2P (1 = actif) pour les équipements derrière un NAT qui
      # bloque la connexion directe. Laisser vide pour la connexion directe.
      DAHUA_P2P_RELAY: ${DAHUA_P2P_RELAY:-}
      # Garde-fous du webhook Dahua (public) : appels/min par enregistreur,
      # tentatives/min par IP avec un jeton inconnu, taille maximale du corps.
      # Vide = valeurs par défaut (120, 20, 65536).
      WEBHOOK_RATE_LIMIT: ${WEBHOOK_RATE_LIMIT:-}
      WEBHOOK_UNKNOWN_TOKEN_RATE_LIMIT: ${WEBHOOK_UNKNOWN_TOKEN_RATE_LIMIT:-}
      WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-}
      # Durée de vie d'une session inactive, en heures (12 par défaut).
      SESSION_MAX_AGE_HOURS: ${SESSION_MAX_AGE_HOURS:-}
      # Plages IPv4 autorisées pour les enregistreurs (vide = tout sauf les
      # adresses réservées et le réseau interne de la plateforme).
      NVR_ALLOWED_CIDRS: ${NVR_ALLOWED_CIDRS:-}
    networks:
      - sentinel-internal
      - nginx-proxy
    # Durcissement : utilisateur non privilégié (Dockerfile), aucune capacité,
    # pas d'escalade, système de fichiers en lecture seule. Seuls /tmp (direct
    # vidéo, tunnel P2P) et le cache Next.js restent inscriptibles, en mémoire.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0755
    pids_limit: 512
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sentinel_pgdata:

networks:
  # Base ↔ application, sans accès extérieur.
  sentinel-internal:
    internal: true
  nginx-proxy:
    external: true
